# MkDocs configuration — Introduction to Computer (ICT)
# Public pages only. The private instructor directory and docs-meta/ are
# deliberately NOT under docs/ and never appear in nav.
# Validated by scripts/validate_nav_sync.py — keep nav and docs/ tree in lock-step.

site_name: Introduction to Computer (ICT)
site_description: >-
  A first-semester university course (32 lectures, 64 contact hours) covering computer
  fundamentals, hardware, software, data representation, digital logic, productivity tools,
  networks, cloud, databases, data science foundations, AI literacy, security, and society.
site_author: Course Instructor
site_url: https://nadeem-majeedch.github.io/Introduction-to-Computer-ICT-Course/

repo_url: https://github.com/nadeem-majeedch/Introduction-to-Computer-ICT-Course
repo_name: nadeem-majeedch/Introduction-to-Computer-ICT-Course
edit_uri: edit/main/docs/

copyright: '&copy; 2026 Course Instructor — content pending license decision (OQ-05)'

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.path
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.linked
  palette:
    # Auto mode respects the reader's OS preference; contrast pairs meet WCAG AA.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    logo: material/school

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.critic
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - tables
  - footnotes
  - toc:
      permalink: true
  - def_list
  - abbr

plugins:
  - search
  - offline

strict: true

